[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "loam-lang"
version = "0.0.8"
description = "Loam: an open language for programmable, closed-loop earthmoving"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]
keywords = ["earthmoving", "construction", "autonomy", "grading", "landxml", "dsl"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
# Every extra is OSI-licensed (see docs/INTEGRATIONS.md); the core needs numpy only.
run = ["paho-mqtt>=2.0"]                                  # EPL-2.0 OR BSD-3-Clause
physics = ["pybullet>=3.2"]                               # zlib
crs = ["pyproj>=3.6"]                                     # MIT
lidar = ["laspy>=2.5", "lazrs>=0.6"]                      # BSD-2-Clause, MIT
raster = ["rasterio>=1.3"]                                # BSD-3-Clause (GDAL: MIT)
ifc = ["ifcopenshell>=0.8"]                               # LGPL-3.0-or-later, used unmodified
mavlink = ["pymavlink>=2.4", "paho-mqtt>=2.0"]            # LGPL-3.0, used unmodified
mcap = ["mcap>=1.1"]                                      # MIT
all = ["loam-lang[run,physics,crs,lidar,raster,ifc,mavlink,mcap]"]
test = ["pytest>=7", "pytest-cov>=4", "coverage>=7.10", "hypothesis>=6", "jsonschema>=4", "paho-mqtt>=2.0",
        "prometheus-client>=0.20", "mcap>=1.1"]
dev = ["loam-lang[test,plot]", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
loam = "loam.cli:main"

[tool.setuptools]
packages = ["loam", "loam.runtime"]

[tool.setuptools.package-data]
loam = ["monitor.html"]

[tool.pytest.ini_options]
markers = ["slow: runs the simulator"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM", "I", "N", "RUF"]
ignore = ["N812", "RUF001", "RUF002", "RUF003"]  # deliberate `ast as A` aliases; ± and × are intended

[tool.mypy]
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["loam"]
branch = true
patch = ["subprocess"]          # measure the site processes the end-to-end test starts
