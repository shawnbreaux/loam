[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loam-lang"
version = "0.0.2"
description = "Loam: an open language for programmable, closed-loop earthmoving"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]
keywords = ["earthmoving", "construction", "autonomy", "grading", "landxml", "dsl"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
run = ["paho-mqtt>=2.0"]
physics = ["pybullet>=3.2"]
test = ["pytest>=7", "pytest-cov>=4", "coverage>=7.10", "hypothesis>=6", "jsonschema>=4", "paho-mqtt>=2.0"]
dev = ["loam-lang[test,plot]", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
loam = "loam.cli:main"

[tool.setuptools]
packages = ["loam", "loam.runtime"]

[tool.setuptools.package-data]
loam = ["monitor.html"]

[tool.pytest.ini_options]
markers = ["slow: runs the simulator"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM", "I", "N", "RUF"]
ignore = ["N812", "RUF001", "RUF002", "RUF003"]  # deliberate `ast as A` aliases; ± and × are intended

[tool.mypy]
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["loam"]
branch = true
patch = ["subprocess"]          # measure the site processes the end-to-end test starts
