# Nav2 (Jazzy) for a tracked carrier in the ic120 namespace, as OPERA runs it: NavFn + Regulated Pure Pursuit,
# open ground (rolling costmaps, inflation only), map -> odom -> base_link.
/ic120/bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /ic120/odom
    bt_loop_duration: 10
    default_server_timeout: 500           # ms to acknowledge a goal: headroom on a busy machine PC
    wait_for_service_timeout: 2000
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose: {plugin: "nav2_bt_navigator::NavigateToPoseNavigator"}
    navigate_through_poses: {plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"}
/ic120/planner_server:
  ros__parameters:
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]
    GridBased: {plugin: "nav2_navfn_planner::NavfnPlanner", tolerance: 0.5, use_astar: false, allow_unknown: true}
/ic120/controller_server:
  ros__parameters:
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker: {plugin: "nav2_controller::SimpleProgressChecker", required_movement_radius: 0.3,
                       movement_time_allowance: 20.0}
    general_goal_checker: {plugin: "nav2_controller::SimpleGoalChecker", xy_goal_tolerance: 0.3,
                           yaw_goal_tolerance: 6.28, stateful: true}
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 1.2
      lookahead_dist: 1.2
      min_lookahead_dist: 0.6
      max_lookahead_dist: 2.0
      use_velocity_scaled_lookahead_dist: false
      use_rotate_to_heading: true
      rotate_to_heading_angular_vel: 0.8
      rotate_to_heading_min_angle: 0.5
      max_angular_accel: 2.0
      use_collision_detection: false
      use_regulated_linear_velocity_scaling: false
      use_cost_regulated_linear_velocity_scaling: false
      allow_reversing: false
      approach_velocity_scaling_dist: 2.0       # a heavy crawler: slow down early for the goal
      min_approach_linear_velocity: 0.1
      transform_tolerance: 0.3
/ic120/local_costmap/local_costmap:
  ros__parameters:
    update_frequency: 5.0
    publish_frequency: 2.0
    global_frame: odom
    robot_base_frame: base_link
    rolling_window: true
    width: 20
    height: 20
    resolution: 0.1
    robot_radius: 1.0
    plugins: ["inflation_layer"]
    inflation_layer: {plugin: "nav2_costmap_2d::InflationLayer", inflation_radius: 1.2}
/ic120/global_costmap/global_costmap:
  ros__parameters:
    update_frequency: 2.0
    publish_frequency: 1.0
    global_frame: map
    robot_base_frame: base_link
    rolling_window: true
    width: 120
    height: 120
    resolution: 0.25
    robot_radius: 1.0
    track_unknown_space: false
    plugins: ["inflation_layer"]
    inflation_layer: {plugin: "nav2_costmap_2d::InflationLayer", inflation_radius: 1.2}
/ic120/behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_costmap_topic: global_costmap/costmap_raw
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "wait"]
    spin: {plugin: "nav2_behaviors::Spin"}
    backup: {plugin: "nav2_behaviors::BackUp"}
    wait: {plugin: "nav2_behaviors::Wait"}
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
/ic120/lifecycle_manager_navigation:
  ros__parameters:
    autostart: true
    node_names: ["controller_server", "planner_server", "behavior_server", "bt_navigator"]
