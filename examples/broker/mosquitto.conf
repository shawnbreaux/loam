# A Mosquitto broker for a real Loam site: encrypted, every client named, each allowed
# only its own topics. Start it with:  mosquitto -c mosquitto.conf
#
# The files named here are yours to create (see docs/RUNTIME.md, "Securing the broker"):
#   ca.crt               the site's certificate authority; every client gets a copy
#   server.crt/.key      the broker's certificate, for this computer's host name or address
#   passwords            written by `mosquitto_passwd`
#   acl                  the access rules beside this file

# No listener without TLS, and nobody connects without a name and password.
listener 8883
cafile ca.crt
certfile server.crt
keyfile server.key
tls_version tlsv1.2
allow_anonymous false
password_file passwords
acl_file acl

# A machine that drops off must not come back to stale orders.
persistence false
