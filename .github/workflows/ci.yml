name: ci
on:
  push:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: |
          sudo apt-get update -q >/dev/null && sudo apt-get install -y -q mosquitto >/dev/null
          echo "== os"; . /etc/os-release; echo "$PRETTY_NAME"; mosquitto -h | head -1; openssl version
          echo "== profile"; sudo cat /etc/apparmor.d/mosquitto
          echo "== profile owner"; dpkg -S /etc/apparmor.d/mosquitto || true
          echo "== default conf"; cat /etc/mosquitto/mosquitto.conf
          echo "== etc tree"; sudo ls -laR /etc/mosquitto
          echo "== user"; id mosquitto; systemctl is-active mosquitto || true
          echo "== unit"; systemctl cat mosquitto | head -40
          echo "== listening"; sudo ss -ltnp | grep -i mosq || echo none
